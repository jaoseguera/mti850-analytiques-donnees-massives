name: Build and Push Docker Image

on:
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - '.github/workflows/docker-publish.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Hadoop and Spark archives
        run: |
          mkdir -p downloads
          echo "Downloading Hadoop 3.5.0..."
          curl -fSL "https://archive.apache.org/dist/hadoop/common/hadoop-3.5.0/hadoop-3.5.0.tar.gz" -o downloads/hadoop-3.5.0.tar.gz
          echo "Downloading Spark 4.2.0..."
          curl -fSL "https://dlcdn.apache.org/spark/spark-4.2.0/spark-4.2.0-bin-hadoop3.tgz" -o downloads/spark-4.2.0-bin-hadoop3.tgz || \
          curl -fSL "https://archive.apache.org/dist/spark/spark-4.2.0/spark-4.2.0-bin-hadoop3.tgz" -o downloads/spark-4.2.0-bin-hadoop3.tgz
          ls -lh downloads/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            jaoseguera/mti850-hadoop-spark:latest
            jaoseguera/mti850-hadoop-spark:1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
